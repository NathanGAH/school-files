<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud File Portal</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #334155;
      --modal-bg: rgba(15, 23, 42, 0.85);
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --border: #e2e8f0;
      --modal-bg: rgba(248, 250, 252, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-color);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .search-bar {
      flex: 1;
      min-width: 200px;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text-color);
      font-size: 1rem;
    }

    .search-bar:focus {
      outline: 2px solid var(--accent);
    }

    .filter-tags {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .tag-btn {
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .tag-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      background-color: var(--card-bg);
      margin-bottom: 2rem;
      cursor: pointer;
    }

    .dropzone.dragover {
      border-color: var(--accent);
      background-color: rgba(56, 189, 248, 0.05);
    }

    .dropzone p {
      color: var(--text-muted);
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }

    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
    }

    .file-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
    }

    .file-info {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .file-icon {
      font-size: 1.5rem;
    }

    .file-details h3 {
      font-size: 1rem;
      font-weight: 600;
      word-break: break-all;
    }

    .file-details span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .file-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn {
      flex: 1;
      padding: 0.5rem;
      border-radius: 6px;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-color);
    }

    /* Preview Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--modal-bg);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      padding: 2rem;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 700px;
      max-height: 80vh;
      overflow: auto;
      padding: 1.5rem;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .preview-container {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
    }

    .preview-container img {
      max-width: 100%;
      border-radius: 8px;
    }

    .preview-container iframe {
      width: 100%;
      height: 400px;
      border: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Cloud File Portal</h1>
      <button class="theme-toggle" id="themeToggle">☀️ Light Mode</button>
    </header>

    <div class="controls">
      <input type="text" id="searchInput" class="search-bar" placeholder="Search files..." />
      <div class="filter-tags">
        <button class="tag-btn active" data-filter="all">All</button>
        <button class="tag-btn" data-filter="document">Docs</button>
        <button class="tag-btn" data-filter="image">Images</button>
        <button class="tag-btn" data-filter="code">Code</button>
      </div>
    </div>

    <div class="dropzone" id="dropzone">
      <strong>📁 Drop files here or click to select</strong>
      <p>Add new files to store or sync</p>
      <input type="file" id="fileInput" multiple style="display: none;" />
    </div>

    <div class="file-grid" id="fileGrid">
      <!-- Sample Items (Edit or replace these links with your own files) -->
      <div class="file-card" data-category="document" data-name="notes.txt">
        <div class="file-info">
          <span class="file-icon">📄</span>
          <div class="file-details">
            <h3>notes.txt</h3>
            <span>Text Document</span>
          </div>
        </div>
        <div class="file-actions">
          <button class="btn btn-secondary" onclick="openPreview('text', 'notes.txt', 'Sample text contents inside notes.txt')">Preview</button>
          <a href="notes.txt" download class="btn btn-primary">Download</a>
        </div>
      </div>

      <div class="file-card" data-category="image" data-name="diagram.png">
        <div class="file-info">
          <span class="file-icon">🖼️</span>
          <div class="file-details">
            <h3>diagram.png</h3>
            <span>Image File</span>
          </div>
        </div>
        <div class="file-actions">
          <button class="btn btn-secondary" onclick="openPreview('image', 'diagram.png', 'https://via.placeholder.com/600x400')">Preview</button>
          <a href="diagram.png" download class="btn btn-primary">Download</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal for File Previewing -->
  <div class="modal" id="previewModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closePreview()">&times;</button>
      <h2 id="modalTitle">File Preview</h2>
      <div class="preview-container" id="modalPreviewContainer"></div>
    </div>
  </div>

  <script>
    // Theme Switcher
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      const currentTheme = document.body.getAttribute('data-theme');
      if (currentTheme === 'light') {
        document.body.removeAttribute('data-theme');
        themeToggle.textContent = '☀️ Light Mode';
      } else {
        document.body.setAttribute('data-theme', 'light');
        themeToggle.textContent = '🌙 Dark Mode';
      }
    });

    // Search and Filtering
    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.tag-btn');
    const fileCards = document.querySelectorAll('.file-card');

    let currentFilter = 'all';

    function filterFiles() {
      const query = searchInput.value.toLowerCase();
      fileCards.forEach(card => {
        const name = card.getAttribute('data-name').toLowerCase();
        const category = card.getAttribute('data-category');

        const matchesSearch = name.includes(query);
        const matchesCategory = currentFilter === 'all' || category === currentFilter;

        if (matchesSearch && matchesCategory) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    searchInput.addEventListener('input', filterFiles);

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        filterFiles();
      });
    });

    // Drag and Drop Zone
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');

    dropzone.addEventListener('click', () => fileInput.click());

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      const files = e.dataTransfer.files;
      handleFiles(files);
    });

    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });

    function handleFiles(files) {
      alert(`${files.length} file(s) selected. Add these files to your GitHub repository to display them here.`);
    }

    // Modal Preview Functionality
    const modal = document.getElementById('previewModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalContainer = document.getElementById('modalPreviewContainer');

    function openPreview(type, name, src) {
      modalTitle.textContent = name;
      modalContainer.innerHTML = '';

      if (type === 'image') {
        const img = document.createElement('img');
        img.src = src;
        modalContainer.appendChild(img);
      } else if (type === 'text') {
        const pre = document.createElement('pre');
        pre.style.whiteSpace = 'pre-wrap';
        pre.textContent = src;
        modalContainer.appendChild(pre);
      }

      modal.style.display = 'flex';
    }

    function closePreview() {
      modal.style.display = 'none';
    }

    window.onclick = function(event) {
      if (event.target === modal) {
        closePreview();
      }
    };
  </script>
</body>
</html>
